schema = "fkst.ops.deployment.v1"

cadence_enabled = true
cadence_interval_seconds = 900
guard_restart_attempt_limit = 3

[[provider]]
id = "github-credential"
kind = "credential.github"
implementation = "fkst-ops:providers/github_credential_gh.py"
contract = "fkst.ops.credential.github.v1"
configuration = { source = "machine:credential-source" }

[[provider]]
id = "engine"
kind = "engine"
implementation = "fkst-ops:providers/engine.py"
contract = "fkst.ops.engine.v1"
configuration = { build_command = ["cargo", "build", "-p", "fkst-framework"] }

[[provider]]
id = "engine-board"
kind = "board.engine-durable"
implementation = "fkst-ops:providers/board_engine_durable.py"
contract = "fkst.ops.board.engine-durable.v1"
configuration = {}

[[provider]]
id = "github-board"
kind = "board.github-control"
implementation = "fkst-ops:providers/board_github_control.sh"
contract = "fkst.ops.board.github-control.v1"
configuration = {}

[[deployment]]
id = "website"
target_identity = "ChronoAIProject/fkst-website"
managed_bot_logins = [
  "macstudio-4[bot]",
  "fkst-loning-s-macbook-m5[bot]",
  "fkst-loning-s-chrono-macbook-pro[bot]",
  "ElonSG",
]

[deployment.author_authorization]
authorized_logins = ["loning", "wanghuan-520"]
authorize_org_members = false
authorize_repo_collaborators = false

[deployment.claim_posture]
mode = "label"
label_exclusive = false

[deployment.github_devloop_profile]
version = "1"
id = "fleet-github-devloop-policy"
data = {}
producer_binding = "github-board"

[deployment.sources.target]
lock_ref = "fkst-website"
[deployment.sources.platform]
lock_ref = "fkst-packages"
[deployment.sources.engine]
lock_ref = "fkst-substrate"

[deployment.engine_revision]
path = ".fkst/substrate-ref"

[deployment.packages]
platform = [
  "github-devloop", "github-devloop-pr", "github-devloop-integration",
  "github-devloop-intake", "github-devloop-workflow", "github-devloop-decompose",
  "github-devloop-ops", "github-proxy", "consensus",
  "github-external-pr-intake", "github-ratchet-migration-slicer", "idle-detector",
]
host = ["site-board"]

[deployment.integration]
upstream_branch = "dev"
integration_branch = "integration"
rollup_merge = "auto"

[deployment.machine]
target_checkout = "website-checkout"
platform_checkout = "website-platform-checkout"
engine_checkout = "engine-checkout"
engine_binary = "engine-binary"
durable = "website-durable"
runtime = "website-runtime"
logs = "website-logs"
rate_pool = "shared-rate-pool"
bot_login = "github-bot-login"

[deployment.providers]
github_credential = "github-credential"
engine = "engine"
board_engine_durable = "engine-board"
board_github_control = "github-board"
