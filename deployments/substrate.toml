schema = "fkst.ops.deployment.v1"

# How often the machine-layer cadence keeps this deployment current. Deployment
# policy, not a machine fact: the mechanism holds no default for it.
cadence_enabled = true
cadence_interval_seconds = 900

# 守护：cadence 观察到该部署 STOPPED 时，最多连续尝试重启多少轮。
# 与上面两条同为 repository-level policy：必填，机制不持默认值。
# 0 = 不启用守护，调用序列与记账与不带该字段时完全一致。
# 取 3 的依据：3 x cadence_interval_seconds = 45 分钟恢复窗口，与已观察到的
# 故障节奏相称；且它把机队级放大倍数钉在 台数 x 部署数 x 3，因为每次尝试都走
# 昂贵的 restart 路径并打同一个共享 GitHub 配额桶。
guard_restart_attempt_limit = 3

# Collaborating managed-bot logins. Authorization membership is deployment policy,
# so it is declared here rather than discovered from the machine.

[[provider]]
id = "github-credential"
kind = "credential.github"
implementation = "fkst-ops:providers/github_credential_gh.py"
contract = "fkst.ops.credential.github.v1"
configuration = { source = "machine:credential-source" }

[[provider]]
id = "engine"
kind = "engine"
implementation = "fkst-ops:providers/engine.py"
contract = "fkst.ops.engine.v1"
configuration = { build_command = ["cargo", "build", "-p", "fkst-framework"] }

[[provider]]
id = "engine-board"
kind = "board.engine-durable"
implementation = "fkst-ops:providers/board_engine_durable.py"
contract = "fkst.ops.board.engine-durable.v1"
configuration = {}

[[provider]]
id = "github-board"
kind = "board.github-control"
implementation = "fkst-ops:providers/board_github_control.sh"
contract = "fkst.ops.board.github-control.v1"
configuration = {}

[[deployment]]
id = "substrate"
target_identity = "ChronoAIProject/fkst-substrate"
github_write_enabled = true
# Collaborating managed-bot logins: authorization membership is deployment policy,
# declared here rather than discovered from the machine.
# 机队成员的操作身份。FKST 既可由 GitHub App 的 bot 账户驱动，也可由人的账户驱动，
# 两者在此一视同仁：本列表登记的是「哪些登录名属于本机队的自动化」，而非账户类型。
# 带 [bot] 后缀的是 App 身份；不带后缀的是人类账户身份。
managed_bot_logins = [
  "macstudio-4[bot]",                       # App
  "fkst-loning-s-macbook-m5[bot]",          # App
  "fkst-loning-s-chrono-macbook-pro[bot]",  # App
  "ElonSG",                                 # 人类账户驱动的 appliance（大小写敏感）
]

# Authors outside the roster above whose issues this deployment will also intake.
# The active appliances do not belong here: the roster already admits them, and
# naming them twice would give the same fact two places to drift from. What is
# left is the human maintainers, who appear in no other list.
#
# An earlier comment on this key claimed that without it the platform "declines
# every author other than its own bot". That is wrong, and reading it that way is
# what made this appliance look policy-blocked when it was not. The trusted set is
# a union the platform composes; fkst-packages docs/user/global-host-profiles.md
# owns that definition.
#
# No blanket org-member or collaborator grant: either flag would let any member's
# issue text steer an unattended appliance.
[deployment.author_authorization]
authorized_logins = ["loning", "wanghuan-520"]
authorize_org_members = false
authorize_repo_collaborators = false

[deployment.claim_posture]
mode = "label"
label_exclusive = false

[deployment.github_devloop_profile]
version = "1"
id = "fleet-github-devloop-policy"
# Deployment-owned values for the board fact tool. Empty on purpose: every key this
# block used to carry restated a fact another owner already holds — the branch
# topology belongs to [deployment.integration], the organization is the first
# segment of target_identity, and the state-label prefix belongs to the platform
# that defines those labels. A restated fact is a second source that can disagree,
# and this one did: it named a shared integration branch while the deployment runs
# a per-appliance one.
data = {}
producer_binding = "github-board"

[deployment.sources.target]
lock_ref = "fkst-substrate"
[deployment.sources.platform]
lock_ref = "fkst-packages"
[deployment.sources.engine]
lock_ref = "fkst-substrate"

[deployment.engine_revision]
path = ".fkst/substrate-ref"

[deployment.packages]
platform = [
  "github-devloop", "github-devloop-pr", "github-devloop-integration",
  "github-devloop-intake", "github-devloop-workflow", "github-devloop-decompose",
  "github-devloop-ops", "github-proxy", "github-external-pr-intake",
  "github-ratchet-migration-slicer", "fkst-substrate-ref-maintainer",
  "integration-coverage-producer", "idle-detector", "git-branch-detector",
  "github-devloop-worktree-gc",
]
host = []

[deployment.integration]
upstream_branch = "dev"
# Machine truth, referenced by logical name. The branch is named for the bot app
# driving the machine, so its value changes per machine while this declaration does
# not. The mechanism resolves a "machine:" reference against [defaults] in the
# machine profile, which is the ignored, machine-local file.
integration_branch = "machine:integration-branch"
rollup_merge = "auto"

[deployment.machine]
target_checkout = "fkst-substrate-checkout"
platform_checkout = "substrate-platform-checkout"
engine_checkout = "engine-checkout"
engine_binary = "engine-binary"
durable = "substrate-durable"
runtime = "substrate-runtime"
logs = "substrate-logs"
rate_pool = "shared-rate-pool"
bot_login = "github-bot-login"

[deployment.providers]
github_credential = "github-credential"
engine = "engine"
board_engine_durable = "engine-board"
board_github_control = "github-board"
