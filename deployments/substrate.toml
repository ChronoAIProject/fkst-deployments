schema = "fkst.ops.deployment.v1"

# How often the machine-layer cadence keeps this deployment current. Deployment
# policy, not a machine fact: the mechanism holds no default for it.
cadence_interval_seconds = 900

# Collaborating managed-bot logins. Authorization membership is deployment policy,
# so it is declared here rather than discovered from the machine.

[[provider]]
id = "engine"
kind = "engine"
implementation = "fkst-ops:providers/engine.py"
contract = "fkst.ops.engine.v1"
configuration = { build_command = ["cargo", "build", "-p", "fkst-framework"] }

[[provider]]
id = "engine-board"
kind = "board.engine-durable"
implementation = "fkst-ops:providers/board_engine_durable.py"
contract = "fkst.ops.board.engine-durable.v1"
configuration = {}

[[provider]]
id = "github-board"
kind = "board.github-control"
implementation = "fkst-ops:providers/board_github_control.sh"
contract = "fkst.ops.board.github-control.v1"
configuration = {}

[[deployment]]
id = "substrate"
target_identity = "ChronoAIProject/fkst-substrate"
# Collaborating managed-bot logins: authorization membership is deployment policy,
# declared here rather than discovered from the machine.
managed_bot_logins = ["fkst-loning-s-macbook-m5[bot]"]

# How this deployment claims work against peer deployments. Declared rather than
# inherited from an unset variable: it must stay consistent across the deployment's
# life and peers must agree about it, unlike the write stance which an operator
# reverses per run. Held at the posture the peer deployments currently use;
# changing it is a fleet-wide decision, not one this deployment makes alone.
[deployment.claim_posture]
mode = "assignee"
label_exclusive = false

[deployment.github_devloop_profile]
version = "1"
id = "fleet-github-devloop-policy"
data = { upstream_branch = "dev", integration_branch = "integration", rollup_merge = "auto", poll_label_prefix = "fkst-dev:", organization = "ChronoAIProject", authorize_org_members = 0 }
producer_binding = "github-board"

[deployment.sources.target]
lock_ref = "fkst-substrate"
[deployment.sources.platform]
lock_ref = "fkst-packages"
[deployment.sources.engine]
lock_ref = "fkst-substrate"

[deployment.packages]
platform = [
  "github-devloop", "github-devloop-pr", "github-devloop-integration",
  "github-devloop-intake", "github-devloop-workflow", "github-devloop-decompose",
  "github-devloop-ops", "github-proxy", "github-external-pr-intake",
  "github-ratchet-migration-slicer", "fkst-substrate-ref-maintainer",
  "integration-coverage-producer", "idle-detector", "git-branch-detector",
  "github-devloop-worktree-gc",
]
host = []

[deployment.integration]
upstream_branch = "dev"
integration_branch = "integration-fkst-loning-s-macbook-m5"
rollup_merge = "auto"

[deployment.machine]
target_checkout = "substrate-target-checkout"
platform_checkout = "substrate-platform-checkout"
engine_checkout = "substrate-target-checkout"   # the substrate deployment operates the engine itself: one pinned source, one checkout
engine_binary = "engine-binary"
durable = "substrate-durable"
runtime = "substrate-runtime"
logs = "substrate-logs"
rate_pool = "shared-rate-pool"
bot_login = "github-bot-login"
managed_bot_set = "managed-bot-logins"

[deployment.providers]
engine = "engine"
board_engine_durable = "engine-board"
board_github_control = "github-board"
